// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.1.1' apply false // Use a recent stable AGP version
    id 'com.android.library' version '8.1.1' apply false // If you had library modules
    id 'org.jetbrains.kotlin.android' version '1.8.0' apply false // Match Kotlin version if possible, or use a recent stable one
}

// The allprojects repositories block has been removed as dependency repository
// management is now handled by the dependencyResolutionManagement block in settings.gradle.
// Buildscript repositories for plugins are defined in the pluginManagement block in settings.gradle.

task clean(type: Delete) {
    delete rootProject.buildDir
}
